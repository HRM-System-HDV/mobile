name: mobile
description: "HRM Enterprise Mobile Application (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0
  http: ^1.2.0
  image_picker: ^1.2.3
  flutter_secure_storage: ^11.2.0
